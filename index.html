<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registre du bar</title>
<style>
  :root{
    --paper:#F3EFE7;
    --ink:#2B2622;
    --ink-soft:#6B6259;
    --line:#D8D0C2;
    --copper:#8C5A2B;
    --copper-deep:#6E4520;
    --input-bg:#FDFCF9;
    --green-fill:#D4EA6B;
    --blue-fill:#9AB6D9;
    --ok:#4F7A3B;
    --off:#B7ADA0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Iowan Old Style","Georgia",serif;
  }
  .ui-font{ font-family:"Avenir Next","Segoe UI",sans-serif; }

  header{
    padding:28px 24px 18px;
    border-bottom:2px solid var(--ink);
  }
  header h1{
    margin:0 0 4px;
    font-size:1.6rem;
    font-weight:600;
    letter-spacing:0.01em;
  }
  header p{
    margin:0;
    color:var(--ink-soft);
    font-family:"Avenir Next","Segoe UI",sans-serif;
    font-size:0.9rem;
  }

  .controls{
    max-width:900px;
    margin:22px auto 0;
    padding:0 20px;
    font-family:"Avenir Next","Segoe UI",sans-serif;
  }
  .control-row{
    display:flex;
    gap:24px;
    flex-wrap:wrap;
    align-items:flex-start;
    margin-bottom:18px;
  }
  .field-group label.title{
    display:block;
    font-size:0.78rem;
    text-transform:none;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  select{
    font-family:inherit;
    font-size:0.95rem;
    padding:8px 10px;
    border:1px solid var(--ink);
    background:var(--input-bg);
    color:var(--ink);
    min-width:240px;
  }
  .days{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .day-btn{
    font-family:inherit;
    font-size:0.85rem;
    padding:8px 14px;
    border:1px solid var(--ink);
    background:var(--input-bg);
    color:var(--ink);
    cursor:pointer;
  }
  .day-btn.active{
    background:var(--ink);
    color:var(--paper);
  }

  .tabs{
    display:flex;
    gap:2px;
    margin:22px auto 0;
    max-width:900px;
    padding:0 20px;
    font-family:"Avenir Next","Segoe UI",sans-serif;
    flex-wrap:wrap;
  }
  .tab{
    padding:10px 16px;
    font-size:0.85rem;
    border:1px solid var(--line);
    border-bottom:none;
    background:#EAE4D8;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .tab.active{
    background:var(--input-bg);
    color:var(--ink);
    border-color:var(--ink);
    font-weight:600;
  }
  .tab.disabled{
    color:var(--off);
    cursor:not-allowed;
    text-decoration:line-through;
  }

  .panel{
    max-width:900px;
    margin:0 auto 40px;
    padding:26px 20px;
    border:1px solid var(--ink);
    background:var(--input-bg);
  }
  .panel h2{
    margin:0 0 4px;
    font-size:1.25rem;
  }
  .panel .sub{
    font-family:"Avenir Next","Segoe UI",sans-serif;
    font-size:0.82rem;
    color:var(--ink-soft);
    margin-bottom:20px;
  }

  table.form-table{
    width:100%;
    border-collapse:collapse;
    font-family:"Avenir Next","Segoe UI",sans-serif;
    font-size:0.88rem;
  }
  table.form-table th{
    text-align:left;
    font-weight:600;
    font-size:0.78rem;
    color:var(--ink-soft);
    padding:6px 8px;
    border-bottom:1px solid var(--ink);
  }
  table.form-table td{
    padding:5px 8px;
    border-bottom:1px solid var(--line);
    vertical-align:middle;
  }
  tr.spacer td{
    border-bottom:1px solid var(--line);
    height:10px;
    padding:0;
  }
  input.num{
    width:100%;
    padding:6px 7px;
    font-family:inherit;
    font-size:0.9rem;
    border:1px solid #B9AE8E;
    background:var(--green-fill);
    color:var(--ink);
  }
  input.num:focus{ outline:2px solid var(--copper); outline-offset:1px; }
  input.num.calc{
    background:var(--blue-fill);
    color:var(--ink);
  }
  input.num.calc:read-only{ opacity:0.95; }
  .expected-cell{
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }

  .bottom-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;
    font-family:"Avenir Next","Segoe UI",sans-serif;
  }
  button.primary{
    font-family:inherit;
    font-size:0.9rem;
    padding:10px 18px;
    background:var(--copper);
    color:#fff;
    border:none;
    cursor:pointer;
  }
  button.primary:hover{ background:var(--copper-deep); }
  .status{ font-size:0.8rem; color:var(--ink-soft); }

  .stub{
    font-family:"Avenir Next","Segoe UI",sans-serif;
    color:var(--ink-soft);
    font-size:0.9rem;
    padding:30px 4px;
  }

  .filebar{
    max-width:900px;
    margin:16px auto 0;
    padding:10px 20px;
    font-family:"Avenir Next","Segoe UI",sans-serif;
    font-size:0.82rem;
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .filebar button{
    font-family:inherit;
    font-size:0.8rem;
    padding:6px 12px;
    border:1px solid var(--ink);
    background:var(--input-bg);
    color:var(--ink);
    cursor:pointer;
  }
  .filebar .status{
    color:var(--ink-soft);
  }
  .filebar .status.connected{ color:var(--ok); }

  .shift-row{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    align-items:flex-end;
    font-family:"Avenir Next","Segoe UI",sans-serif;
    margin-bottom:18px;
  }
  .stock-btn{
    margin-left:auto;
    font-family:inherit;
    font-size:0.85rem;
    padding:12px 18px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    cursor:pointer;
    align-self:flex-end;
  }
  .stock-btn:hover{ background:var(--copper-deep); }
  .field label{
    display:block;
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  .field select, .field input{
    font-family:inherit;
    font-size:0.9rem;
    padding:7px 9px;
    border:1px solid var(--ink);
    background:var(--input-bg);
  }
  .field.standalone{
    max-width:260px;
    margin-bottom:18px;
    font-family:"Avenir Next","Segoe UI",sans-serif;
  }
  .field.standalone input{ width:100%; background:var(--green-fill); }
  .field.standalone input.calc{ background:var(--blue-fill); }

  .tax-block{
    margin-bottom:18px;
    font-family:"Avenir Next","Segoe UI",sans-serif;
    border:1px solid var(--line);
    padding:14px;
  }
  .tax-title{
    font-size:0.85rem;
    font-weight:600;
    margin-bottom:10px;
  }
  .tax-row{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
  }
  .tax-row .field{ min-width:130px; flex:1; }
  .tax-row input{ width:100%; }
  .tax-row .field:first-child input{ background:var(--green-fill); }
  .tax-row .field:not(:first-child) input{ background:var(--blue-fill); }

  .pdf-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:14px;
    font-family:"Avenir Next","Segoe UI",sans-serif;
  }
  .pdf-btn{
    font-family:inherit;
    font-size:0.9rem;
    padding:20px 16px;
    text-align:left;
    border:1px solid var(--ink);
    background:var(--input-bg);
    color:var(--ink);
    cursor:pointer;
  }
  .pdf-btn:hover{ background:var(--ink); color:var(--paper); }
  @media (max-width:560px){ .pdf-grid{ grid-template-columns:1fr; } }

  .poker-grid{
    display:grid;
    grid-template-columns:repeat(11, minmax(52px, 1fr));
    grid-auto-rows:34px;
    gap:3px;
    font-family:"Avenir Next","Segoe UI",sans-serif;
    font-size:0.82rem;
    margin-top:10px;
    overflow-x:auto;
  }
  .pg-cell{
    display:flex;
    align-items:center;
    padding:4px 6px;
    border:1px solid var(--line);
    background:var(--input-bg);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .pg-label{ color:var(--ink-soft); border:none; background:transparent; }
  .pg-header{ font-weight:600; border:none; background:transparent; color:var(--ink-soft); }
  .pg-calc{ background:var(--blue-fill); color:var(--ink); font-variant-numeric:tabular-nums; }
  .pg-unknown{ background:#F2A65A; color:#3A2A12; font-weight:600; }
  .pg-day{ font-weight:700; color:var(--ink); border:none; background:transparent; }

  .print-btn{
    font-family:"Avenir Next","Segoe UI",sans-serif;
    font-size:0.85rem;
    padding:8px 16px;
    border:1px solid var(--copper);
    background:transparent;
    color:var(--copper-deep);
    cursor:pointer;
    margin-left:10px;
  }
  .print-btn:hover{ background:var(--copper); color:#fff; }
  .print-all-btn{
    font-family:"Avenir Next","Segoe UI",sans-serif;
    font-size:0.9rem;
    padding:12px 20px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
    margin-top:18px;
  }
  .print-all-btn:hover{ background:var(--copper-deep); border-color:var(--copper-deep); }

  #printAllHost{ display:none; }
  .print-sheet-page{ page-break-after:always; padding:14px 0; }

  #loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--paper);
  }
  .login-box{
    background:var(--input-bg);
    border:1px solid var(--ink);
    padding:36px 32px;
    width:100%;
    max-width:320px;
    font-family:"Avenir Next","Segoe UI",sans-serif;
    text-align:center;
  }
  .login-box h1{
    font-family:"Iowan Old Style","Georgia",serif;
    font-size:1.4rem;
    margin:0 0 4px;
  }
  .login-sub{
    color:var(--ink-soft);
    font-size:0.85rem;
    margin:0 0 20px;
  }
  .login-label{
    display:block;
    text-align:left;
    font-size:0.78rem;
    color:var(--ink-soft);
    margin:14px 0 5px;
  }
  #roleSelect, #pinInput{
    width:100%;
    padding:9px 10px;
    font-size:0.95rem;
    border:1px solid var(--ink);
    background:var(--input-bg);
    font-family:inherit;
  }
  #loginBtn{
    width:100%;
    margin-top:22px;
    padding:11px;
  }
  .login-error{
    color:#B0402A;
    font-size:0.8rem;
    margin-top:12px;
    min-height:1em;
  }

  #prefsModal{
    position:fixed; inset:0; background:rgba(0,0,0,0.4);
    display:flex; align-items:center; justify-content:center;
    z-index:100;
  }
  .prefs-box{
    background:var(--input-bg); border:1px solid var(--ink);
    padding:28px 26px; width:100%; max-width:340px;
    font-family:"Avenir Next","Segoe UI",sans-serif;
  }
  .theme-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:8px;
  }
  .theme-swatch{
    padding:12px 10px; border:2px solid transparent; cursor:pointer;
    font-size:0.82rem; text-align:center; border-radius:2px;
  }
  .theme-swatch.active{ border-color:var(--ink); font-weight:600; }

  /* Theme overrides — applied via a class on <body> */
  body.theme-nuit{
    --paper:#1C1A22; --ink:#EDE8F0; --ink-soft:#A79FB5; --line:#3A3545;
    --copper:#C98BD9; --copper-deep:#A566B8; --input-bg:#282433;
    --green-fill:#4A5A2A; --blue-fill:#2E4A5E; --off:#5A5468;
  }
  body.theme-rose{
    --paper:#FDF1F5; --ink:#5A2A3E; --ink-soft:#A8677E; --line:#F3D4E0;
    --copper:#E0679A; --copper-deep:#C24C80; --input-bg:#FFFAFC;
    --green-fill:#F6D9E6; --blue-fill:#E3C8F0; --off:#D9A9BC;
  }
  body.theme-espresso{
    --paper:#F5EDE3; --ink:#3B2A1E; --ink-soft:#8A7360; --line:#DDC9B0;
    --copper:#8B5A2B; --copper-deep:#6E4520; --input-bg:#FBF6EF;
    --green-fill:#D9C9A0; --blue-fill:#C9B896; --off:#C4B29A;
  }

  @media print{
    .no-print{ display:none !important; }
    @page{ size: landscape; margin: 8mm; }
    body{ background:#fff; }
    .panel, .print-sheet-page{ border:none !important; padding:0 !important; margin:0 0 4mm 0 !important; }
    .panel h2, .print-sheet-page h2{ font-size:0.95rem !important; margin:0 0 2px !important; }
    .panel .sub, .print-sheet-page .sub{ font-size:0.65rem !important; margin-bottom:4px !important; }
    .poker-grid{
      font-size:0.68rem !important;
      grid-auto-rows:1fr !important;
      height:180mm !important;
      gap:1.5px !important;
    }
    .poker-grid.compact-print{
      font-size:0.62rem !important;
      grid-auto-rows:16px !important;
      height:auto !important;
    }
    .poker-grid.inventory-print{
      font-size:0.68rem !important;
      grid-auto-rows:18px !important;
      height:auto !important;
    }
    .pg-cell{ padding:1px 3px !important; }
    .form-table{ font-size:0.65rem !important; }
    .form-table th, .form-table td{ padding:2px 4px !important; }
    .stub{ font-size:0.6rem !important; padding:4px 0 0 !important; }
    .shift-row{ margin-bottom:4px !important; }
    .print-sheet-page{ page-break-after:always; }
    .print-sheet-page:last-child{ page-break-after:auto; }
  }
</style>
</head>
<body>

<div id="loginScreen" class="no-print">
  <div class="login-box">
    <h1 class="ui-font">Registre du bar</h1>
    <p class="login-sub">Choisis ton rôle et entre le NIP.</p>
    <label class="login-label">Rôle</label>
    <select id="roleSelect">
      <option value="barmaid">Barmaid</option>
      <option value="janitor">Janitor</option>
      <option value="boss">Boss</option>
    </select>
    <label class="login-label" id="barmaidNameLabel" style="display:none;">Quelle barmaid?</label>
    <select id="barmaidNameSelect" style="display:none;"></select>
    <label class="login-label">NIP</label>
    <input type="password" id="pinInput" inputmode="numeric" maxlength="6" placeholder="••••">
    <button id="loginBtn" class="primary">Entrer</button>
    <div id="loginError" class="login-error"></div>
  </div>
</div>

<div id="appShell" style="display:none;">
<header class="no-print">
  <h1 class="ui-font">Registre du bar — feuilles hebdomadaires</h1>
  <p>Prototype hors-ligne — étape 1 (le proprio remplit lui-même les formulaires papier)</p>
  <div style="margin-top:8px; display:flex; gap:10px;">
    <button id="logoutBtn" class="print-btn no-print">Changer de rôle</button>
    <button id="prefsBtn" class="print-btn no-print">Préférences</button>
  </div>
</header>

<div id="prefsModal" class="no-print" style="display:none;">
  <div class="prefs-box">
    <h2 style="margin-top:0;">Préférences</h2>

    <label class="login-label">Changer le NIP (<span id="prefsRoleName"></span>)</label>
    <input type="password" id="newPinInput" inputmode="numeric" maxlength="6" placeholder="Nouveau NIP">
    <button id="savePinBtn" class="print-btn" style="margin-top:8px;">Enregistrer le NIP</button>
    <div id="pinSaveMsg" class="login-error" style="color:var(--ok);"></div>

    <label class="login-label" style="margin-top:20px;">Thème</label>
    <div id="themeGrid" class="theme-grid"></div>

    <button id="closePrefsBtn" class="stock-btn" style="margin-top:20px; width:100%;">Fermer</button>
  </div>
</div>

<div class="controls no-print" id="mainUI">
  <div class="control-row">
    <div class="field-group">
      <label class="title">Semaine</label>
      <select id="weekSelect"></select>
    </div>
    <div class="field-group">
      <label class="title">Jour</label>
      <div class="days" id="dayButtons"></div>
    </div>
  </div>
</div>

<div class="filebar no-print">
  <span class="status" id="fileStatus">Prêt — le premier clic sur "Enregistrer" demandera une fois où garder le fichier.</span>
</div>

<div class="tabs no-print" id="tabBar"></div>
<div id="panelHost"></div>

<div id="printAllHost"></div>
</div>

<script>
// ---------- Data model ----------
const inventaireItems = [
  {name:"Budweiser", expected:96}, {name:"Bud Light", expected:48},
  {name:"Bleu", expected:32}, {name:"Labatt 50", expected:24},
  {name:"Mich. Ultra", expected:24}, {name:"Corona 0%", expected:24},
  {name:"Corona", expected:48}, {name:"White Claw", expected:"?"},
  {spacer:true}, {spacer:true},
  {name:"Biere inter", expected:40}, {name:"Smirnoff Ice", expected:8},
  {name:"Red Bull", expected:16}, {name:"Rev", expected:8},
  {spacer:true}, {spacer:true},
  {name:"Eau", expected:16}, {name:"Perrier", expected:8},
  {name:"Liqueur", expected:24}, {name:"Jus Clamato", expected:10},
  {name:"Cup à Café", expected:10}, {name:"Chips", expected:12},
  {name:"Gomme", expected:12}, {name:"Peanuts", expected:12},
  {name:"Pepperoni", expected:12}
];

const deliveryItems = [
  {name:"Budweiser"},
  {name:"Budlight"}, {name:"Bleue"}, {name:"Labatt 50"}, {name:"Michael OB"},
  {name:"Corona 0%"}, {name:"Corona"},
  {spacer:true},
  {name:"White Claw"},
  {spacer:true},
  {name:"Smirnoff"}
];

const dayNames = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const deliveryDays = ["Lundi","Jeudi"];

const tabs = [
  {id:"bartDay", label:"Bartend. Jour", ready:true},
  {id:"bartNight", label:"Bartend. Soir", ready:true},
  {id:"stockDay", label:"Stock (Jour)", ready:true},
  {id:"stockNight", label:"Stock (Nuit)", ready:true},
  {id:"inventaire", label:"Inventaire Journalier", ready:true},
  {id:"delivery", label:"Beer Delivery", ready:true, restrictedTo:deliveryDays},
  {id:"misc", label:"Poker", ready:true},
  {id:"sunday", label:"Misc.", ready:true},
  {id:"pdfSheets", label:"Feuilles PDF", ready:true}
];

const pdfSheetList = [
  "#1 Poker/Lotto Summary",
  "#2 Overall Summary",
  "#3 Transaction Summary",
  "#4 Shift Summary",
  "#5 Inventory Summary",
  "#6 For the Accountant"
];

// Real staff schedule (A/B rotation), supplied by user.
const staffSchedule = {
  "A": {
    "Monday":    { "Day":"Val",      "Night":"Tanya" },
    "Tuesday":   { "Day":"Val",      "Night":"Steph" },
    "Wednesday": { "Day":"Claudine", "Night":"Jen" },
    "Thursday":  { "Day":"Steph",    "Night":"Tanya" },
    "Friday":    { "Day":"Jen",      "Night":"Steph" },
    "Saturday":  { "Day":"Tanya",    "Night":"Maude" },
    "Sunday":    { "Day":"Steph",    "Night":"Jen" }
  },
  "B": {
    "Monday":    { "Day":"Val",      "Night":"Tanya" },
    "Tuesday":   { "Day":"Val",      "Night":"Steph" },
    "Wednesday": { "Day":"Claudine", "Night":"Jen" },
    "Thursday":  { "Day":"Steph",    "Night":"Tanya" },
    "Friday":    { "Day":"Jen",      "Night":"Steph" },
    "Saturday":  { "Day":"Tanya",    "Night":"Steph" },
    "Sunday":    { "Day":"Tanya",    "Night":"Jen" }
  }
};
const dayNameToEn = {Lundi:"Monday", Mardi:"Tuesday", Mercredi:"Wednesday", Jeudi:"Thursday", Vendredi:"Friday", Samedi:"Saturday", Dimanche:"Sunday"};
const bartenders = [...new Set(
  Object.values(staffSchedule).flatMap(week => Object.values(week).flatMap(day => Object.values(day)))
)].sort();

// Which real calendar weeks are "A" vs "B" is not yet confirmed — placeholder anchor below.
// EDIT ref date once the owner confirms which actual week is an A week.
function weekParity(monday){
  const ref = getMonday(new Date(Date.UTC(2024,0,1)));
  const diffWeeks = Math.round((monday - ref)/(7*24*3600*1000));
  return diffWeeks % 2 === 0 ? 'A' : 'B';
}
function defaultBartender(dayName, shiftType, monday){
  const parity = weekParity(monday);
  const enDay = dayNameToEn[dayName];
  const shiftKey = shiftType === 'bartDay' ? 'Day' : 'Night';
  const entry = staffSchedule[parity] && staffSchedule[parity][enDay];
  return entry ? entry[shiftKey] : "";
}

const shiftConfig = {
  bartDay:   { label:"Bartender — Quart de jour",  defaultStart:"11:00", defaultEnd:"19:00" },
  bartNight: { label:"Bartender — Quart de soir",  defaultStart:"19:00", defaultEnd:"03:00" }
};

function round2(n){ return Math.round(n*100)/100; }
function hoursBetween(start, end){
  if(!start || !end) return 0;
  const [sh,sm] = start.split(':').map(Number);
  const [eh,em] = end.split(':').map(Number);
  let startMin = sh*60+sm, endMin = eh*60+em;
  if(endMin <= startMin) endMin += 24*60; // overnight shift
  return (endMin-startMin)/60;
}
function taxBreakdown(total){
  const t = Number(total)||0;
  const subtotal = t/1.14975;
  const tps = subtotal*0.05;
  const tvq = subtotal*0.09975;
  return { subtotal:round2(subtotal), tps:round2(tps), tvq:round2(tvq) };
}

// in-memory store: data[weekKey][day][formId] = { field: value, ... }
const data = {};

function weekKey(mondayDate){ return mondayDate.toISOString().slice(0,10); }

function getMonday(d){
  const date = new Date(d);
  const day = date.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  date.setDate(date.getDate() + diff);
  date.setHours(0,0,0,0);
  return date;
}

function formatWeekLabel(monday){
  const sunday = new Date(monday); sunday.setDate(sunday.getDate()+6);
  const opts = {day:"numeric", month:"long"};
  return `Semaine du ${monday.toLocaleDateString('fr-CA',opts)} au ${sunday.toLocaleDateString('fr-CA',opts)}`;
}

const weeks = [];
{
  const thisMonday = getMonday(new Date());
  for(let i=0;i<4;i++){
    const m = new Date(thisMonday);
    m.setDate(m.getDate() - 7*i);
    weeks.push(m);
  }
}

function ensureBucket(){

}

const tabBar = document.getElementById('tabBar');
function tabIsActiveForDay(t){
  if(!t.restrictedTo) return true;
  return t.restrictedTo.includes(state.day);
}
function renderTabs(){
  tabBar.innerHTML = "";
  const allowed = roleTabs[state.role] || [];
  tabs.filter(t=>allowed.includes(t.id)).forEach(t=>{
    const el = document.createElement('div');
    const enabled = tabIsActiveForDay(t);
    el.className = 'tab' + (t.id===state.tab?' active':'') + (!enabled?' disabled':'');
    el.textContent = t.label + (t.restrictedTo && !enabled ? " (fermé)" : "");
    if(enabled){
      el.addEventListener('click', ()=>{ state.tab = t.id; state.subView = null; state.pdfView = null; renderTabs(); renderPanel(); });
    }
    tabBar.appendChild(el);
  });
}
renderTabs();

const panelHost = document.getElementById('panelHost');

function renderPanel(){
  panelHost.innerHTML = "";
  const tab = tabs.find(t=>t.id===state.tab);
  if(!tab || !tabIsActiveForDay(tab)){
    // auto-fallback to inventaire if current tab got disabled by day change
    state.tab = "inventaire";
    return renderPanel();
  }

  const panel = document.createElement('div');
  panel.className = 'panel';

  if(tab.id === "inventaire"){
    panel.appendChild(buildInventairePanel());
  } else if(tab.id === "delivery"){
    panel.appendChild(buildDeliveryPanel());
  } else if(tab.id === "bartDay" || tab.id === "bartNight"){
    if(state.subView === 'stock'){
      panel.appendChild(buildStockPanel(tab.id));
    } else {
      panel.appendChild(buildShiftPanel(tab.id));
    }
  } else if(tab.id === "stockDay"){
    panel.appendChild(buildStockPanel('bartDay'));
  } else if(tab.id === "stockNight"){
    panel.appendChild(buildStockPanel('bartNight'));
  } else if(tab.id === "misc"){
    panel.appendChild(buildMiscPanel());
  } else if(tab.id === "sunday"){
    panel.appendChild(buildSundayPanel());
  } else if(tab.id === "pdfSheets"){
    panel.appendChild(buildPdfSheetsPanel());
  } else {
    const stub = document.createElement('div');
    stub.className = 'stub';
    stub.textContent = `${tab.label} — formulaire pas encore défini. On le fera après les deux premiers.`;
    panel.appendChild(stub);
  }
  panelHost.appendChild(panel);
}

function printAllSheets(){

  host.innerHTML = "";

  const builders = [
    buildPokerSheet, buildOverallSheet, buildTransactionSheet,
    buildShiftSummarySheet, buildInventorySheet, buildAccountantSheet
  ];
  builders.forEach(fn=>{
    const page = document.createElement('div');
    page.className = 'print-sheet-page';
    page.appendChild(fn());
    host.appendChild(page);
  });

  // Hide the normal UI, show only the print-all host, print, then restore.
  document.querySelectorAll('header, #mainUI, .filebar, #tabBar, #panelHost').forEach(el=>{
    el.classList.add('no-print');
  });
  host.style.display = 'block';

  function cleanup(){
    document.querySelectorAll('header, #mainUI, .filebar, #tabBar, #panelHost').forEach(el=>{
      el.classList.remove('no-print');
    });
    host.style.display = 'none';
    host.innerHTML = '';
    window.removeEventListener('afterprint', cleanup);
  }
  window.addEventListener('afterprint', cleanup);
  window.print();
}

function bucketFor(weekK, dayN){
  if(!data[weekK]) data[weekK] = {};
  if(!data[weekK][dayN]) data[weekK][dayN] = {};
  return data[weekK][dayN];
}

function weekBucket(weekK){
  if(!data[weekK]) data[weekK] = {};
  if(!data[weekK].sunday) data[weekK].sunday = {};
  return data[weekK].sunday;
}

function computeWeekTransactionTotals(weekK){
  let totJour=0, totSoir=0, totOver=0, totTPS=0, totTVQ=0, totInterac=0, totArgent=0;
  dayNames.forEach(d=>{
    const bucket = bucketFor(weekK, d);
    ['bartDay','bartNight'].forEach(k=>{
      const s = bucket[k];
      if(!s) return;
      const cash=s.cash||{}, interac=s.interac||{};
      const jour=Number(s.jour)||0, soir=Number(s.nuit)||0, over=Number(s.over)||0;
      const tps=round2((Number(cash.tps)||0)+(Number(interac.tps)||0));
      const tvq=round2((Number(cash.tvq)||0)+(Number(interac.tvq)||0));
      const int=Number(interac.total)||0;
      totJour+=jour; totSoir+=soir; totOver+=over; totTPS+=tps; totTVQ+=tvq; totInterac+=int;
      totArgent += round2(jour+soir+over+tps+tvq-int);
    });
  });
  let meOver=0,meTPS=0,meTVQ=0,meInterac=0,meHasShift=false;
  dayNames.forEach(d=>{
    const b=bucketFor(weekK,d);
    ['bartDay','bartNight'].forEach(k=>{
      const s=b[k];
      if(s&&s.bartender==='Me'){
        meHasShift=true;
        const cash=s.cash||{}, interac=s.interac||{};
        meOver+=Number(s.over)||0;
        meTPS+=(Number(cash.tps)||0)+(Number(interac.tps)||0);
        meTVQ+=(Number(cash.tvq)||0)+(Number(interac.tvq)||0);
        meInterac+=Number(interac.total)||0;
      }
    });
  });
  const sun = weekBucket(weekK);
  const readingKnown = sun.reading!=="" && sun.reading!==undefined;
  const meArgent = readingKnown ? round2(Number(sun.reading)+meOver+meTPS+meTVQ-meInterac) : null;
  return {totJour,totSoir,totOver,totTPS,totTVQ,totInterac,totArgent,
          meOver,meTPS,meTVQ,meInterac,meArgent,meHasShift,readingKnown};
}

function computeWeekPokerTotals(weekK){
  let coupons=0, inserted=0, argent=0, machine=0, guichet=0;
  dayNames.forEach(d=>{
    const b = bucketFor(weekK, d);
    coupons += Number(b.misc?.coupons)||0;
    inserted += Number(b.misc?.total)||0;
    argent += Number(b.misc?.argent)||0;
    machine += Number(b.misc?.machine)||0;
    guichet += Number(b.misc?.guichet)||0;
  });
  const total = round2(coupons + argent + machine + guichet); // B17
  const overPoker = round2(total - inserted); // D17
  return {coupons, inserted, argent, machine, guichet, total, overPoker};
}

function buildInventorySheet(){
  const wrap = document.createElement('div');
  const weekLabel = weekSelect.options[weekSelect.selectedIndex].textContent;
  wrap.innerHTML = `
    <h2>#5 Inventory Summary</h2>
    <div class="sub">${weekLabel} — Start = Debut + livraison lundi + livraison jeudi. Fin = Start − total vendu de la semaine (Fin jour + Fin soir + Ajouté de l'Inventaire Journalier). Debut lui-même n'a pas encore de source, donc Start/Fin restent "?" pour l'instant.</div>
  `;
  wrap.querySelector('h2').appendChild(buildPrintButton());

  const items = ['Budweiser','Budlight','Bleue','Labatt 50','Michael OB','Corona 0%','Corona','White Claw','Smirnoff'];
  const stockAliases = {
    'Budweiser':'Budweiser', 'Budlight':'Bud Light', 'Bleue':'Bleu', 'Labatt 50':'Labatt 50',
    'Michael OB':'Mich. Ultra', 'Corona 0%':'Corona 0%', 'Corona':'Corona',
    'White Claw':'White Claw', 'Smirnoff':'Smirnoff Ice'
  };
  const deliveryAliases = {
    'Budweiser':'Budweiser',
    'Budlight':'Budlight', 'Bleue':'Bleue', 'Labatt 50':'Labatt 50', 'Michael OB':'Michael OB',
    'Corona 0%':'Corona 0%', 'Corona':'Corona', 'White Claw':'White Claw', 'Smirnoff':'Smirnoff'
  };
  function stockRowIndex(name){ return inventaireItems.findIndex(it=>!it.spacer && it.name===name); }
  function deliveryRowIndex(name){ return deliveryItems.findIndex(it=>!it.spacer && it.name===name); }

  function bartenderAjout(bucket, invName){
    const idx = stockRowIndex(stockAliases[invName]);
    if(idx===-1) return null;
    let sum = 0, found = false;
    ['bartDay','bartNight'].forEach(k=>{
      const r = bucket[k]?.stock?.[`row${idx}`];
      if(r){ sum += Number(r.ajoutBeers)||0; found = true; }
    });
    return found ? sum : 0;
  }
  // "Sold" for a given day/item = Bartender Jour Fin + Bartender Soir Fin + Janitor's Inventaire Journalier Ajouté.
  function bartenderFin(bucket, invName){
    const idx = stockRowIndex(stockAliases[invName]);
    if(idx===-1) return null;
    let sum = 0, found = false;
    ['bartDay','bartNight'].forEach(k=>{
      const r = bucket[k]?.stock?.[`row${idx}`];
      if(r){ sum += Number(r.fin)||0; found = true; }
    });
    const inv = bucket.inventaire?.[`row${idx}`];
    if(inv){ sum += Number(inv.added)||0; found = true; }
    return found ? sum : 0;
  }
  function deliveryCases24(bucket, invName){
    const alias = deliveryAliases[invName];
    if(!alias) return null;
    const idx = deliveryRowIndex(alias);
    if(idx===-1) return null;
    const r = bucket.delivery?.[`row${idx}`];
    return r && r.cases ? Number(r.cases)*24 : 0;
  }

  // Ajout per item per weekday — computed once, reused by both tables.
  const ajoutByItem = {};
  const finByItem = {};
  items.forEach(item=>{
    ajoutByItem[item] = dayNames.map(d=> bartenderAjout(bucketFor(state.week, d), item));
    finByItem[item] = dayNames.map(d=> bartenderFin(bucketFor(state.week, d), item));
  });

  // Start = Debut (bottom table) + Monday delivery + Thursday delivery.
  // Debut itself still has no real source, so Start stays "?" until that's resolved —
  // but the formula is wired so it'll compute automatically the moment Debut does.
  const debutByItem = {}, startByItem = {}, finTopByItem = {};
  items.forEach(item=>{
    const debut = null; // no source yet
    const monday = deliveryCases24(bucketFor(state.week,'Lundi'), item) || 0;
    const thursday = deliveryCases24(bucketFor(state.week,'Jeudi'), item) || 0;
    debutByItem[item] = debut;
    startByItem[item] = debut===null ? null : round2(debut + monday + thursday);

    const weekSold = finByItem[item].some(v=>v===null) ? null
                    : finByItem[item].reduce((s,v)=>s+(v||0),0);
    finTopByItem[item] = (startByItem[item]===null || weekSold===null)
      ? null : round2(startByItem[item] - weekSold);
  });

  function grid(){
    const g = document.createElement('div');
    g.className = 'poker-grid inventory-print';
    return g;
  }
  function cellIn(g, row, col, text, cls){
    const d = document.createElement('div');
    d.className = 'pg-cell' + (cls ? ' '+cls : '');
    d.style.gridRow = row; d.style.gridColumn = col;
    d.textContent = text;
    g.appendChild(d);
  }

  // Shared column layout for BOTH tables (compact rows — no gaps):
  // col1=beer name, col2=Start/Debut, col3=Lundi, col4=Mardi, col5=Mecredi,
  // col6=Jeudi, col7=Vendredi, col8=Samedi, col9=Dimanche, col10=Fin

  const h1 = document.createElement('div');
  h1.className = 'sub'; h1.style.marginTop = '4px';
  h1.textContent = 'Start / semaine / Fin — 9 bières × 9 colonnes';
  wrap.appendChild(h1);

  const g1 = grid();
  cellIn(g1,1,2,'Start','pg-header');
  dayNames.forEach((d,i)=> cellIn(g1,1,3+i,d,'pg-header'));
  cellIn(g1,1,10,'Fin','pg-header');
  items.forEach((item,i)=>{
    const row = 2+i;
    cellIn(g1,row,1,item,'pg-label');
    cellIn(g1,row,2, startByItem[item]===null?'?':startByItem[item], startByItem[item]===null?'pg-unknown':'pg-calc');
    ajoutByItem[item].forEach((v,ci)=>{
      if(v===null) cellIn(g1,row,3+ci,'?','pg-unknown');
      else cellIn(g1,row,3+ci, round2(v), 'pg-calc');
    });
    cellIn(g1,row,10, finTopByItem[item]===null?'?':finTopByItem[item], finTopByItem[item]===null?'pg-unknown':'pg-calc');
  });
  wrap.appendChild(g1);

  const h2 = document.createElement('div');
  h2.className = 'sub'; h2.style.marginTop = '22px';
  h2.textContent = 'Debut, livraison (lundi + jeudi seulement) et Vendu (Fin jour + Fin soir + Inventaire Journalier) — alignés sous les mêmes colonnes';
  wrap.appendChild(h2);

  const g2 = grid();
  cellIn(g2,1,2,'Debut','pg-header');
  cellIn(g2,1,3,'Lundi (livraison)','pg-header');
  cellIn(g2,1,6,'Jeudi (livraison)','pg-header');
  cellIn(g2,1,8,'Vendu','pg-header');
  cellIn(g2,1,9,'Total','pg-header');
  items.forEach((item,i)=>{
    const row = 2+i;
    cellIn(g2,row,1,item,'pg-label');
    cellIn(g2,row,2, debutByItem[item]===null?'?':debutByItem[item], debutByItem[item]===null?'pg-unknown':'pg-calc'); // Debut

    const monday = deliveryCases24(bucketFor(state.week,'Lundi'), item);
    cellIn(g2,row,3, monday===null?'?':round2(monday), monday===null?'pg-unknown':'pg-calc');

    const thursday = deliveryCases24(bucketFor(state.week,'Jeudi'), item);
    cellIn(g2,row,6, thursday===null?'?':round2(thursday), thursday===null?'pg-unknown':'pg-calc');

    // Vendu mini-table, under Samedi/Dimanche — sum of "Fin" (sold) across the week
    cellIn(g2,row,8,item,'pg-label');
    const perDay = finByItem[item];
    const anyUnknown = perDay.some(v=>v===null);
    const total = perDay.reduce((s,v)=> s+(v||0), 0);
    cellIn(g2,row,9, anyUnknown?'?':round2(total), anyUnknown?'pg-unknown':'pg-calc');
  });
  wrap.appendChild(g2);

  wrap.appendChild(buildBottomBar());
  return wrap;
}

function buildOverallSheet(){
  const wrap = document.createElement('div');
  const weekLabel = weekSelect.options[weekSelect.selectedIndex].textContent;
  wrap.innerHTML = `
    <h2>#2 Overall Summary</h2>

  const staffList = ['Val','Tanya','Maude','Jen','Stephanie','Claudine','Schneider'];
  const nameMap2 = {Val:'Val', Tanya:'Tanya', Maude:'Maude', Jen:'Jen', Steph:'Stephanie', Claudine:'Claudine', Me:'Schneider'};

  const grid = document.createElement('div');

  function cell(row, col, text, cls){

  cell(2,1,'Staff','pg-header'); cell(2,3,'Vente/Semaine','pg-header');
  cell(2,4,'Tot TX','pg-header'); cell(2,5,'Heures','pg-header');

  // Aggregate every shift this week, per staff member
  const totals = {};
  staffList.forEach(n=> totals[n] = {vente:0, tax:0, heures:0});

  dayNames.forEach(d=>{
    const bucket = bucketFor(state.week, d);
    ['bartDay','bartNight'].forEach(k=>{
      const s = bucket[k];
      if(!s || !s.bartender) return;
      const longName = nameMap2[s.bartender] || s.bartender;
      if(!totals[longName]) return;
      const cash = s.cash||{}, interac = s.interac||{};
      totals[longName].vente += (Number(s.jour)||0) + (Number(s.nuit)||0);
      totals[longName].tax += (Number(cash.tps)||0)+(Number(cash.tvq)||0)+(Number(interac.tps)||0)+(Number(interac.tvq)||0);
      totals[longName].heures += hoursBetween(s.start, s.end);
    });
  });

  // Schneider's Vente/Semaine comes from Reading (Sunday tab), not Jour/Nuit — he doesn't use those fields.
  const readingKnown = sun.reading !== "" && sun.reading !== undefined;
  const schneiderVenteKnown = readingKnown;
  totals['Schneider'].vente = readingKnown ? Number(sun.reading) : null;

  staffList.forEach((name,i)=>{
    const row = 3+i;
    cell(row,1,name,'pg-label');
    if(name==='Schneider' && totals[name].vente===null){
      cell(row,3,'?','pg-unknown');
    } else {
      cell(row,3, round2(totals[name].vente), 'pg-calc');
    }
    cell(row,4, round2(totals[name].tax), 'pg-calc');
    cell(row,5, round2(totals[name].heures), 'pg-calc');
  });

  // Weekly aggregates needed by all three side blocks — computed once, used everywhere below.
  const tt = computeWeekTransactionTotals(state.week);
  const block1Caisses = round2(tt.totJour + tt.totSoir);
  const factOverKnown = sun.factOver !== "" && sun.factOver !== undefined;
  const block1Over = factOverKnown ? round2(tt.totOver + tt.meOver + Number(sun.factOver)) : null;
  const block1Taxes = round2(tt.totTPS + tt.meTPS + tt.totTVQ + tt.meTVQ);
  const block1Interac = round2(tt.totInterac + tt.meInterac);
  const pk = computeWeekPokerTotals(state.week);
  const block2Poker = round2(pk.inserted - pk.coupons);
  const poolKnown = sun.poolTbxl !== "" && sun.poolTbxl !== undefined;
  const pinutsKnown = sun.pinutsTbxl !== "" && sun.pinutsTbxl !== undefined;
  const paieJaboinKnown = sun.paieJaboin !== "" && sun.paieJaboin !== undefined;

  function unk(row, col, label){
    cell(row, col, label, 'pg-label');
    cell(row, col+1, '?', 'pg-unknown');
  }
  function known(row, col, label, value){
    cell(row, col, label, 'pg-label');
    if(value===null) cell(row, col+1, '?', 'pg-unknown');
    else cell(row, col+1, value, 'pg-calc');

  // Top-right "Caisses" block — Caisses repeats block 1; Poker repeats block 2's Poker; Pool/Pinuts from #3 (Sunday);

  cell(2,7,'Caisses','pg-header');
  cell(2,8, block1Caisses, 'pg-calc'); // the header row itself also holds the Caisses value, per the real file
  known(3,7,'Poker', block2Poker);
  known(4,7,'Pool', poolKnown ? round2(Number(sun.poolTbxl)) : null);
  known(5,7,'Pinut', pinutsKnown ? round2(Number(sun.pinutsTbxl)) : null);
  known(6,7,'Paie Jaboin', paieJaboinKnown ? round2(Number(sun.paieJaboin)) : null);
  known(7,7,'Taxes', block1Taxes);
  const topRightKnown = poolKnown && pinutsKnown && paieJaboinKnown;
  const topRightTotal = topRightKnown ? round2(
    block1Caisses + block2Poker + Number(sun.poolTbxl) + Number(sun.pinutsTbxl) + Number(sun.paieJaboin) + block1Taxes
  ) : null;
  known(9,7,'Total', topRightTotal);

  known(13,1,'Over', block1Over);
  known(14,1,'Taxes', block1Taxes);
  known(15,1,'Interac', block1Interac);

  // Middle-right block: Reste = the top-right block's Total, minus everything above it here.
  const facturesKnown = sun.factures !== "" && sun.factures !== undefined;
  const guichCaissesKnown = sun.guichCaisses !== "" && sun.guichCaisses !== undefined;
  known(12,5,'Facture', facturesKnown ? round2(Number(sun.factures)) : null);
  known(13,5,'Interac', block1Interac);
  known(14,5,'Guich Pok', round2(pk.guichet));
  known(15,5,'Guich Caiss', guichCaissesKnown ? round2(Number(sun.guichCaisses)) : null);
  unk(16,5,'Depot'); // held off — several "Depot" fields already exist, needs owner clarification
  known(17,5,'Coup/Valid', round2(pk.machine));
  known(19,5,'Reste', null); // Depot is unresolved, so this can never honestly compute yet

  // Block 2 (lower-left): Caisses/Over Caisses repeat block 1; Poker/Over Poker from #1; Bouteilles/Autres from Sunday; Over Pool pinned.
  const bouteillesKnown = sun.bouteilles !== "" && sun.bouteilles !== undefined;
  const autresKnown = sun.autres !== "" && sun.autres !== undefined;

  known(19,1,'Caisses', block1Caisses);
  known(20,1,'Over Caisses', block1Over);
  known(21,1,'Poker', block2Poker);

  known(23,1,'Bouteilles', bouteillesKnown ? round2(Number(sun.bouteilles)) : null);
  known(24,1,'Pool', poolKnown ? round2(Number(sun.poolTbxl)) : null);
  const poolOverKnown = sun.poolOver !== "" && sun.poolOver !== undefined;
  known(25,1,'Over Pool', poolOverKnown ? round2(Number(sun.poolOver)) : null);
  known(26,1,'Pinuts', pinutsKnown ? round2(Number(sun.pinutsTbxl)) : null);
  known(27,1,'Autres', autresKnown ? round2(Number(sun.autres)) : null);
  const lowerLeftKnown = block1Over!==null && bouteillesKnown && poolKnown && poolOverKnown && pinutsKnown && autresKnown;
  const lowerLeftTotal = lowerLeftKnown ? round2(
    block1Caisses + block1Over + block2Poker + pk.overPoker +
    Number(sun.bouteilles) + Number(sun.poolTbxl) + Number(sun.poolOver) +
    Number(sun.pinutsTbxl) + Number(sun.autres)
  ) : null;
  known(29,1,'Total', lowerLeftTotal);

  // Lower-right block: Over Poker/Over Caisses repeat other cells; Bouteilles reuses the same Sunday field;
  // Over Pool now comes from Sunday's new Pool section; Env from #3's Sunday-sourced ENV; Paye Dan new field.
  const envKnown = sun.env !== "" && sun.env !== undefined;
  const payeDanKnown = sun.payeDan !== "" && sun.payeDan !== undefined;

  known(19,7,'Over Poker', pk.overPoker);
  known(20,7,'Over Caisses', block1Over);
  known(21,7,'Bouteilles', bouteillesKnown ? round2(Number(sun.bouteilles)) : null);
  known(22,7,'Over Pool', poolOverKnown ? round2(Number(sun.poolOver)) : null);
  known(23,7,'Reste Env', envKnown ? round2(Number(sun.env)) : null);
  const lowerRightTotKnown = poolOverKnown && bouteillesKnown && envKnown;
  const lowerRightTot = lowerRightTotKnown ? round2(

  ) : null;
  known(25,7,'Tot', lowerRightTot);
  known(26,7,'Paye Dan', payeDanKnown ? round2(Number(sun.payeDan)) : null);
  const lowerRightReste = (lowerRightTot!==null && payeDanKnown) ? round2(lowerRightTot - Number(sun.payeDan)) : null;
  known(28,7,'Reste', lowerRightReste);
  known(29,7,'Total', lowerRightReste); // the "+R15" term dropped — see the flag note

  wrap.appendChild(grid);
  const flagNote = document.createElement('div');
  flagNote.className='stub'; flagNote.style.padding='10px 0 0';
  flagNote.innerHTML = `<strong>3 cellules à vérifier avec le proprio :</strong> "Reste Env" (fichier original pointe vers l'étiquette texte "ENV" plutôt que sa vraie valeur — j'ai corrigé pour utiliser la vraie valeur, à confirmer). Le "Total" tout en bas (lower-right) additionnait une cellule vide sans lien apparent — retiré, à confirmer que ce n'était pas voulu. "Over Pool" (les deux endroits) pointait vers la même source que "Over Poker" — probablement une erreur de copier-coller, laissé en pause comme tu l'avais demandé.`;
  wrap.appendChild(flagNote);
  if(!readingKnown){

    note.className='stub'; note.style.padding='10px 0 0';
    note.textContent = "Reading (onglet Sunday) pas encore rempli — le Vente/Semaine de Schneider reste \"?\".";

  wrap.appendChild(buildBottomBar());

}

function buildTransactionSheet(){
  const wrap = document.createElement('div');
  const weekLabel = weekSelect.options[weekSelect.selectedIndex].textContent;
  wrap.innerHTML = `
    <h2>#3 Transaction Summary</h2>
    <div class="sub">${weekLabel} — Jour/Soir/Over/TPS/TVQ/Interac par quart. Argent = Jour+Soir+Over+TPS+TVQ−Interac.</div>
  `;
  wrap.querySelector('h2').appendChild(buildPrintButton());

  const sun = weekBucket(state.week);

  const dayRows = [
    {day:'Lundi',    label:'Lundi',    header:3,  d:4,  n:5 },
    {day:'Mardi',    label:'Mardi',    header:6,  d:7,  n:8 },
    {day:'Mercredi', label:'Mecredi',  header:9,  d:10, n:11},
    {day:'Jeudi',    label:'Jeudi',    header:12, d:13, n:14},
    {day:'Vendredi', label:'Vendredi', header:15, d:16, n:17},
    {day:'Samedi',   label:'Samedi',   header:18, d:19, n:20},
    {day:'Dimanche', label:'Dimanche', header:21, d:22, n:23}
  ];

  const grid = document.createElement('div');
  grid.className = 'poker-grid';
  function cell(row, col, text, cls){
    const d = document.createElement('div');
    d.className = 'pg-cell' + (cls ? ' '+cls : '');
    d.style.gridRow = row;
    d.style.gridColumn = col;
    d.textContent = text;
    grid.appendChild(d);
  }
  // cols: A=1 B=2(Jour) C=3(Soir) D=4(Over) E=5(TPS) F=6(TVQ) G=7(Interac) H=8(Argent) I=9 J=10

  cell(2,2,'Jour','pg-header'); cell(2,3,'Soir','pg-header');
  cell(2,4,'Over','pg-header'); cell(2,5,'TPS','pg-header'); cell(2,6,'TVQ','pg-header');
  cell(2,7,'Interac','pg-header'); cell(2,8,'Argent','pg-header');

  // Weekly running totals
  let totJour=0, totSoir=0, totOver=0, totTPS=0, totTVQ=0, totInterac=0, totArgent=0;

  function shiftRow(bucket, shiftKey, row){
    const s = bucket[shiftKey];
    cell(row, 1, s?.bartender || '', 'pg-label');
    if(!s) return;
    const cash = s.cash || {}, interac = s.interac || {};
    const jour = Number(s.jour)||0;
    const soir = Number(s.nuit)||0;
    const over = Number(s.over)||0;
    const tps = round2((Number(cash.tps)||0)+(Number(interac.tps)||0));
    const tvq = round2((Number(cash.tvq)||0)+(Number(interac.tvq)||0));
    const int = Number(interac.total)||0;
    const argent = round2(jour + soir + over + tps + tvq - int);

    cell(row, 2, jour, 'pg-calc');
    cell(row, 3, soir, 'pg-calc');
    cell(row, 4, over, 'pg-calc');
    cell(row, 5, tps, 'pg-calc');
    cell(row, 6, tvq, 'pg-calc');
    cell(row, 7, int, 'pg-calc');
    cell(row, 8, argent, 'pg-calc');

    totJour += jour; totSoir += soir; totOver += over; totTPS += tps; totTVQ += tvq;
    totInterac += int; totArgent += argent;
  }

  dayRows.forEach(dr=>{
    cell(dr.header, 1, dr.label, 'pg-day');
    const bucket = bucketFor(state.week, dr.day);
    shiftRow(bucket, 'bartDay', dr.d);
    shiftRow(bucket, 'bartNight', dr.n);
  });

  // Schneider block (bottom-right): Reading now comes from the Sunday tab.
  let meOver=0, meTPS=0, meTVQ=0, meInterac=0, meHasShift=false;
  dayNames.forEach(d=>{
    const b = bucketFor(state.week, d);
    ['bartDay','bartNight'].forEach(k=>{
      const s = b[k];
      if(s && s.bartender === 'Me'){
        meHasShift = true;
        const cash = s.cash||{}, interac = s.interac||{};
        meOver += Number(s.over)||0;
        meTPS += (Number(cash.tps)||0)+(Number(interac.tps)||0);
        meTVQ += (Number(cash.tvq)||0)+(Number(interac.tvq)||0);
        meInterac += Number(interac.total)||0;
      }
    });
  });
  const readingKnown = sun.reading !== "" && sun.reading !== undefined;
  const meArgent = readingKnown ? round2(Number(sun.reading) + meOver + meTPS + meTVQ - meInterac) : '?';

  cell(17,10,'Schneider','pg-header');
  cell(18,9,'Reading','pg-label'); cell(18,10, readingKnown ? round2(Number(sun.reading)) : '?', readingKnown?'pg-calc':'pg-unknown');
  cell(19,9,'Over','pg-label');    cell(19,10, round2(meOver), 'pg-calc');
  cell(20,9,'TPS','pg-label');     cell(20,10, round2(meTPS), 'pg-calc');
  cell(21,9,'TVQ','pg-label');     cell(21,10, round2(meTVQ), 'pg-calc');
  cell(22,9,'Interac','pg-label'); cell(22,10, round2(meInterac), 'pg-calc');
  cell(23,9,'Argent','pg-label');  cell(23,10, meArgent, readingKnown?'pg-calc':'pg-unknown');

  // TOTAL row (row 25) — matches the real formulas, folding in the Schneider block for D-H.
  cell(25,1,'Total','pg-day');
  cell(25,2, round2(totJour), 'pg-calc');
  cell(25,3, round2(totSoir), 'pg-calc');
  cell(25,4, round2(totOver + meOver), 'pg-calc');
  cell(25,5, round2(totTPS + meTPS), 'pg-calc');
  cell(25,6, round2(totTVQ + meTVQ), 'pg-calc');
  cell(25,7, round2(totInterac + meInterac), 'pg-calc');
  cell(25,8, readingKnown ? round2(totArgent + meArgent) : '?', readingKnown ? 'pg-calc' : 'pg-unknown');

  // Top-right block — pulled from the Sunday tab
  function sunCell(row, col, key, label){
    cell(row, col, label, 'pg-label');
    const known = sun[key] !== "" && sun[key] !== undefined;
    cell(row, col+1, known ? round2(Number(sun[key])) : '?', known?'pg-calc':'pg-unknown');
  }
  sunCell(1,9,'env','ENV');
  sunCell(3,10,'factures','Factures');
  cell(6,10,'Pool','pg-header'); // section label, not its own value
  sunCell(7,9,'poolTbxl','TXBL');
  sunCell(8,9,'poolOver','Over');
  cell(10,10,'Pinuts','pg-header'); // section label, not its own value
  sunCell(11,9,'pinutsTbxl','TBXL');
  sunCell(13,9,'factOver','Fact. Over');

  wrap.appendChild(grid);

  const note = document.createElement('div');
  note.className = 'stub'; note.style.padding = '10px 0 0';
  let msg = "";
  if(!meHasShift) msg += "Aucun quart pris par 'Me' cette semaine — les valeurs Schneider Over/TPS/TVQ/Interac sont à 0.";
  if(!readingKnown) msg += (msg?" ":"") + "Reading (Sunday) pas encore rempli — l'Argent de Schneider et le Total général restent \"?\".";
  note.textContent = msg;
  if(msg) wrap.appendChild(note);

  wrap.appendChild(buildBottomBar());
  return wrap;
}

function buildShiftSummarySheet(){
  const wrap = document.createElement('div');
  const weekLabel = weekSelect.options[weekSelect.selectedIndex].textContent;
  wrap.innerHTML = `
    <h2>#4 Shift Summary</h2>
    <div class="sub">${weekLabel} — Entrée/Sortie de chaque quart, heures calculées automatiquement.</div>
  `;
  wrap.querySelector('h2').appendChild(buildPrintButton());

  const staffColumns = ['Val','Tanya','Maude','Jennifer','Stephanie','Claudine','ME'];
  const nameMap = {Val:'Val', Tanya:'Tanya', Maude:'Maude', Jen:'Jennifer', Steph:'Stephanie', Claudine:'Claudine', Me:'ME'};

  const dayRows = [
    {day:'Lundi',    label:'Lundi',    header:4,  entree:5,  sortie:6 },
    {day:'Mardi',    label:'Mardi',    header:8,  entree:9,  sortie:10},
    {day:'Mercredi', label:'Mecredi',  header:13, entree:14, sortie:15},
    {day:'Jeudi',    label:'Jeudi',    header:17, entree:18, sortie:19},
    {day:'Vendredi', label:'Vendredi', header:21, entree:22, sortie:23},
    {day:'Samedi',   label:'Samedi',   header:25, entree:26, sortie:27},
    {day:'Dimanche', label:'Dimanche', header:29, entree:30, sortie:31}
  ];

  function hoursBetween(start, end){
    if(!start || !end) return 0;
    const [sh,sm] = start.split(':').map(Number);
    const [eh,em] = end.split(':').map(Number);
    let startMin = sh*60+sm, endMin = eh*60+em;
    if(endMin <= startMin) endMin += 24*60; // overnight shift
    return (endMin-startMin)/60;
  }

  const totals = staffColumns.map(()=>0);

  const grid = document.createElement('div');
  grid.className = 'poker-grid';
  function cell(row, col, text, cls){
    const d = document.createElement('div');
    d.className = 'pg-cell' + (cls ? ' '+cls : '');
    d.style.gridRow = row;
    d.style.gridColumn = col;
    d.textContent = text;
    grid.appendChild(d);
  }

  staffColumns.forEach((name,i)=> cell(3, i+2, name, 'pg-header'));

  dayRows.forEach(dr=>{
    cell(dr.header, 1, dr.label, 'pg-day');
    cell(dr.entree, 1, 'Entrée', 'pg-label');
    cell(dr.sortie, 1, 'Sortie', 'pg-label');

    const bucket = bucketFor(state.week, dr.day);
    [['bartDay'],['bartNight']].forEach(([shiftKey])=>{
      const shift = bucket[shiftKey];
      if(!shift || !shift.bartender) return;
      const longName = nameMap[shift.bartender] || shift.bartender;
      const colIdx = staffColumns.indexOf(longName);
      if(colIdx !== -1){
        cell(dr.entree, colIdx+2, shift.start || '', 'pg-calc');
        cell(dr.sortie, colIdx+2, shift.end || '', 'pg-calc');
        totals[colIdx] += hoursBetween(shift.start, shift.end);
      }
      // Second bartender covering the same shift (e.g. a busy party night)
      if(shift.hasSecondBartender && shift.bartender2){
        const longName2 = nameMap[shift.bartender2] || shift.bartender2;
        const colIdx2 = staffColumns.indexOf(longName2);
        if(colIdx2 !== -1){
          cell(dr.entree, colIdx2+2, shift.start2 || '', 'pg-calc');
          cell(dr.sortie, colIdx2+2, shift.end2 || '', 'pg-calc');
          totals[colIdx2] += hoursBetween(shift.start2, shift.end2);
        }
      }
    });
  });

  cell(33, 1, 'Total', 'pg-label');
  let grandTotal = 0;
  totals.forEach((h,i)=>{
    cell(33, i+2, round2(h), 'pg-calc');
    grandTotal += h;
  });
  cell(33, 10, round2(grandTotal), 'pg-calc');
  cell(33, 11, 'total', 'pg-label');

  wrap.appendChild(grid);
  wrap.appendChild(buildBottomBar());
  return wrap;
}

function computeWeekPokerFull(weekK){
  let win=0, inserted=0, argent=0, machine=0, guichet=0;
  dayNames.forEach(d=>{
    const b = bucketFor(weekK, d);
    win += Number(b.misc?.coupons)||0;
    inserted += Number(b.misc?.total)||0;
    argent += Number(b.misc?.argent)||0;
    machine += Number(b.misc?.machine)||0;
    guichet += Number(b.misc?.guichet)||0;
  });
  const B12 = round2(win), F12 = round2(inserted);
  const B14 = round2(argent), B15 = round2(machine), B16 = round2(guichet);
  const B17 = round2(B12+B14+B15+B16);
  const D17 = round2(B17-F12); // Over poker
  const sun = weekBucket(weekK);
  const depotKnown = sun.depot !== "" && sun.depot !== undefined;
  const depot = depotKnown ? Number(sun.depot) : null;
  const reste = depotKnown ? round2(B17 - B12 - depot) : null;
  const depart = depotKnown ? round2(reste + D17) : null;
  return {B12,F12,B14,B15,B16,B17,D17,depot,reste,depart,depotKnown};
}

  function refreshG1(){
    if(sun.departManualOverride){
      g1Input.disabled = false;
      g1Input.value = sun.departManualValue;
    } else {
      g1Input.disabled = true;
      g1Input.value = autoValue===null ? '' : autoValue;
      g1Input.placeholder = autoValue===null ? 'Aucune donnée la semaine dernière' : '';
    }
  }
  g1Input.addEventListener('input', ()=>{ sun.departManualValue = g1Input.value; });
  g1Check.addEventListener('change', ()=>{
    sun.departManualOverride = g1Check.checked;
    if(g1Check.checked && sun.departManualValue===""){
      sun.departManualValue = autoValue===null ? "" : autoValue;
    }
    refreshG1();
  });
  refreshG1();

  g1Row.appendChild(g1Input); g1Row.appendChild(g1Check); g1Row.appendChild(g1Label);
  g1Box.appendChild(g1Row);
  wrap.appendChild(g1Box);

  // Pull the known values first.
  const dayData = dayNames.map(d=>{
    const b = bucketFor(state.week, d);
    const win = Number(b.misc?.coupons)||0;
    const inserted = Number(b.misc?.total)||0;
    return { day:d, win, inserted, net: round2(inserted - win) };
  });
  const wk = computeWeekPokerFull(state.week);
  const B12 = wk.B12, F12 = wk.F12, B14 = wk.B14, B15 = wk.B15, B16 = wk.B16;
  const G12 = round2(dayData.reduce((s,r)=>s+r.net,0));
  const B17 = wk.B17, D17 = wk.D17;
  const J3 = B17;  // = B17
  const J5 = B12;  // Coupons
  const J6 = wk.depotKnown ? wk.depot : '?';  // Depot — manual, entered on the Poker tab
  const J8 = wk.reste===null ? '?' : wk.reste;  // Reste = Total - Coupons - Depot
  const J10 = D17; // = D17
  const J12 = wk.depart===null ? '?' : wk.depart; // Depart = Reste + Over
  const J14 = G12; // = G12
  const J15 = round2(J14*0.8); // LottoQ
  const J16 = round2(J14*0.2); // Club

  const grid = document.createElement('div');
  grid.className = 'poker-grid';

  function cell(row, col, text, cls){
    const d = document.createElement('div');
    d.className = 'pg-cell' + (cls ? ' '+cls : '');
    d.style.gridRow = row;
    d.style.gridColumn = col;
    d.textContent = text;
    grid.appendChild(d);
  }
  // col letters: A=1 B=2 C=3 D=4 E=5 F=6 G=7 H=8 I=9 J=10 K=11

  cell(1,'1 / 5', `Date: ${weekLabel}`, 'pg-label');

  cell(3,2,'Total','pg-header'); cell(3,5,'Tot inséré','pg-header');
  cell(3,6,'Total','pg-header'); cell(3,7,'net','pg-header'); cell(3,9,'Total','pg-header');
  cell(3,10, J3, 'pg-calc');

  dayData.forEach((r,i)=>{
    const row = 4+i;
    cell(row,1,r.day,'pg-day');
    cell(row,2,r.win,'pg-calc');
    cell(row,5,r.day,'pg-label');
    cell(row,6,r.inserted,'pg-calc');
    cell(row,7,r.net,'pg-calc');
  });
  cell(5,8,'-','pg-label'); cell(5,9,'Coupons','pg-label'); cell(5,10,J5,'pg-calc');
  cell(6,8,'=','pg-label'); cell(6,9,'Depot','pg-label'); cell(6,10,J6, wk.depotKnown?'pg-calc':'pg-unknown');
  cell(8,9,'Reste','pg-label'); cell(8,10,J8, wk.reste===null?'pg-unknown':'pg-calc');
  cell(10,9,'Over','pg-label'); cell(10,10,J10,'pg-calc');

  cell(12,1,'Total','pg-label'); cell(12,2,B12,'pg-calc');
  cell(12,5,'Total','pg-label'); cell(12,6,F12,'pg-calc'); cell(12,7,G12,'pg-calc');
  cell(12,9,'Depart','pg-label'); cell(12,10,J12, wk.depart===null?'pg-unknown':'pg-calc');

  cell(14,1,'Argent','pg-label'); cell(14,2,B14,'pg-calc');
  cell(14,9,'Total','pg-label'); cell(14,10,J14,'pg-calc'); cell(14,11,'total net','pg-label');

  cell(15,1,'machine','pg-label'); cell(15,2,B15,'pg-calc');
  cell(15,9,'LottoQ','pg-label'); cell(15,10,J15,'pg-calc'); cell(15,11,'0.8','pg-label');

  cell(16,1,'Guichet','pg-label'); cell(16,2,B16,'pg-calc');
  cell(16,9,'Club','pg-label'); cell(16,10,J16,'pg-calc'); cell(16,11,'0.2','pg-label');

  cell(17,1,'Total','pg-label'); cell(17,2,B17,'pg-calc');
  cell(17,3,'over poker','pg-label'); cell(17,4,D17,'pg-calc');

  wrap.appendChild(grid);
  wrap.appendChild(buildBottomBar());
  return wrap;
}

  secondCheckLabel.textContent = 'Deuxième barmaid ce quart (ex: soirée occupée)';
  secondCheckRow.appendChild(secondCheck); secondCheckRow.appendChild(secondCheckLabel);
  wrap.appendChild(secondCheckRow);

  const secondRow = document.createElement('div');
  secondRow.className = 'shift-row';
  secondRow.style.display = store.hasSecondBartender ? 'flex' : 'none';

  const b2Field = document.createElement('div'); b2Field.className='field';
  b2Field.innerHTML = `<label>Bartender #2</label>`;

    const opt = document.createElement('option'); opt.value=name; opt.textContent=name;
    if(name===store.bartender2) opt.selected = true;

  e2Field.innerHTML = `<label>Heure de fin</label>`;

  const nuitInput = document.createElement('input');
  nuitInput.type='number'; nuitInput.className='num'; nuitInput.value = store.nuit;

  function recalcJourNuitTaxes(){
    const total = round2((Number(store.jour)||0) + (Number(store.nuit)||0));
    const b = taxBreakdown(total);
    store.cash = {total, subtotal:b.subtotal, tps:b.tps, tvq:b.tvq};
  }
  jourInput.addEventListener('input', ()=>{ store.jour = jourInput.value; recalcJourNuitTaxes(); });

  recalcJourNuitTaxes(); // keep store.cash in sync even before any edit this session

function buildStockPanel(shiftType){
  const cfg = shiftConfig[shiftType];
  const bucket = ensureBucket();
  if(!bucket[shiftType]) bucket[shiftType] = {};
  const store = bucket[shiftType];
  if(!store.stock) store.stock = {};

  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <h2>Stock du quart — ${cfg.label}</h2>
    <div class="sub">${state.day} — ${weekSelect.options[weekSelect.selectedIndex].textContent}. Début, Ajout (caisses × 24, éditable), Fin (vendu), Total (calculé).</div>
  `;

  const table = document.createElement('table');
  table.className = 'form-table';
  table.innerHTML = `<thead><tr><th>Marque</th><th>Début</th><th>Ajout — caisses</th><th>Ajout — bières</th><th>Fin (vendu)</th><th>Total</th></tr></thead>`;
  const tbody = document.createElement('tbody');

  inventaireItems.forEach((item, idx)=>{
    const tr = document.createElement('tr');
    if(item.spacer){ tr.className='spacer'; tr.innerHTML = `<td colspan="6"></td>`; tbody.appendChild(tr); return; }
    const key = `row${idx}`;
    if(!store.stock[key]) store.stock[key] = { debut:"", ajoutCases:"", ajoutBeers:"", fin:"", total:"" };
    const rowStore = store.stock[key];

    // Night shift: default Début from the same day's Day-shift ending Total, if not already set.
    if(shiftType === 'bartNight' && rowStore.debut === ""){
      const dayTotal = bucket.bartDay?.stock?.[key]?.total;
      if(dayTotal !== undefined && dayTotal !== "") rowStore.debut = dayTotal;
    }

    const tdName = document.createElement('td'); tdName.textContent = item.name;

    const tdDebut = document.createElement('td');
    const inDebut = document.createElement('input');
    inDebut.type='number'; inDebut.className='num'; inDebut.value = rowStore.debut;

    const tdCases = document.createElement('td');
    const inCases = document.createElement('input');
    inCases.type='number'; inCases.className='num'; inCases.step='1'; inCases.min='0'; inCases.value = rowStore.ajoutCases;

    const tdBeers = document.createElement('td');
    const inBeers = document.createElement('input');
    inBeers.type='number'; inBeers.className='num calc'; inBeers.value = rowStore.ajoutBeers;

    const tdFin = document.createElement('td');
    const inFin = document.createElement('input');
    inFin.type='number'; inFin.className='num'; inFin.value = rowStore.fin;

    const tdTotal = document.createElement('td');
    const inTotal = document.createElement('input');
    inTotal.type='number'; inTotal.className='num calc'; inTotal.value = rowStore.total;

    function recalcTotal(){
      rowStore.total = round2((Number(rowStore.debut)||0) + (Number(rowStore.ajoutBeers)||0) - (Number(rowStore.fin)||0));
      inTotal.value = rowStore.total;
    }

    inDebut.addEventListener('input', ()=>{ rowStore.debut = inDebut.value; recalcTotal(); });
    inCases.addEventListener('input', ()=>{
      rowStore.ajoutCases = inCases.value;
      rowStore.ajoutBeers = inCases.value === "" ? "" : round2(Number(inCases.value)*24);
      inBeers.value = rowStore.ajoutBeers;
      recalcTotal();
    });
    inBeers.addEventListener('input', ()=>{ rowStore.ajoutBeers = inBeers.value; recalcTotal(); });
    inFin.addEventListener('input', ()=>{ rowStore.fin = inFin.value; recalcTotal(); });
    inTotal.addEventListener('input', ()=>{ rowStore.total = inTotal.value; });

    tdDebut.appendChild(inDebut); tdCases.appendChild(inCases); tdBeers.appendChild(inBeers);
    tdFin.appendChild(inFin); tdTotal.appendChild(inTotal);
    tr.appendChild(tdName); tr.appendChild(tdDebut); tr.appendChild(tdCases); tr.appendChild(tdBeers);
    tr.appendChild(tdFin); tr.appendChild(tdTotal);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);

  const bar = document.createElement('div');
  bar.className = 'bottom-bar';
  const status = document.createElement('div');
  status.className = 'status'; status.textContent = "Pas encore enregistré.";
  const btn = document.createElement('button');
  btn.className = 'primary';
  btn.textContent = 'Enregistrer';
  btn.addEventListener('click', async ()=>{
    await saveData(status);
  });
  bar.appendChild(status); bar.appendChild(btn);
  wrap.appendChild(bar);

  if(state.subView === 'stock'){
    const back = document.createElement('button');
    back.className = 'print-btn no-print'; back.style.marginTop = '10px';
    back.textContent = '← Retour au quart';
    back.addEventListener('click', ()=>{ state.subView = null; renderPanel(); });
    wrap.appendChild(back);
  }

  return wrap;
}

  const subInput = document.createElement('input');
  subInput.type='number'; subInput.className='num calc'; subInput.value = store.subtotal;
  subInput.addEventListener('input', ()=>{ store.subtotal = subInput.value; });

  const tpsField = document.createElement('div'); tpsField.className='field';
  tpsField.innerHTML = `<label>TPS (5%)</label>`;
  const tpsInput = document.createElement('input');
  tpsInput.type='number'; tpsInput.className='num calc'; tpsInput.value = store.tps;
  tpsInput.addEventListener('input', ()=>{ store.tps = tpsInput.value; });

  const tvqField = document.createElement('div'); tvqField.className='field';
  tvqField.innerHTML = `<label>TVQ (9.975%)</label>`;
  const tvqInput = document.createElement('input');
  tvqInput.type='number'; tvqInput.className='num calc'; tvqInput.value = store.tvq;
  tvqInput.addEventListener('input', ()=>{ store.tvq = tvqInput.value; });

  totalInput.addEventListener('input', ()=>{
    store.total = totalInput.value;
    const b = taxBreakdown(totalInput.value);
    store.subtotal = b.subtotal; store.tps = b.tps; store.tvq = b.tvq;
    subInput.value = b.subtotal; tpsInput.value = b.tps; tvqInput.value = b.tvq;
  });

  totalField.appendChild(totalInput);
  subField.appendChild(subInput);
  tpsField.appendChild(tpsInput);
  tvqField.appendChild(tvqInput);

  row.appendChild(totalField); row.appendChild(subField); row.appendChild(tpsField); row.appendChild(tvqField);
  block.appendChild(row);
  return block;
}

// ---------- JSON file persistence (auto, one-time setup) ----------
let fileHandle = null;
let pendingHandle = null;
const fileStatusEl = document.getElementById('fileStatus');
const fsAccessSupported = 'showSaveFilePicker' in window;

const DB_NAME = 'barformsdb', STORE = 'handles';
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(STORE); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbSet(key, val){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).put(val,key);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(STORE,'readonly');
    const req = tx.objectStore(STORE).get(key);
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}

async function loadFromHandle(){
  try{
    const file = await fileHandle.getFile();
    const text = await file.text();
    if(text.trim()){
      const parsed = JSON.parse(text);
      Object.keys(data).forEach(k=>delete data[k]);
      Object.assign(data, parsed);
      restoreSettings();
      renderPanel();
    }
  }catch(e){ /* empty or unreadable, just start fresh */ }
}

function restoreSettings(){
  if(data.settings?.pins) Object.assign(rolePins, data.settings.pins);
  if(data.settings?.theme) applyTheme(data.settings.theme);
}

async function writeToHandle(){
  const writable = await fileHandle.createWritable();
  await writable.write(JSON.stringify(data, null, 2));
  await writable.close();
}

function setConnected(){
  fileStatusEl.textContent = `Sauvegarde automatique active (${fileHandle.name}).`;
  fileStatusEl.classList.add('connected');
}
function setNeedsReconnect(){
  fileStatusEl.textContent = 'Reconnexion nécessaire — clique "Enregistrer" une fois.';
  fileStatusEl.classList.remove('connected');
}

// Silent check on load: if we already have a remembered handle with live permission, use it with no prompt.
(async ()=>{
  if(!fsAccessSupported) return;
  try{
    const saved = await idbGet('fileHandle');
    if(saved){
      const perm = await saved.queryPermission({mode:'readwrite'});
      if(perm === 'granted'){
        fileHandle = saved;
        await loadFromHandle();
        setConnected();
      } else {
        pendingHandle = saved; // will silently re-request on next Save click (needs a user gesture)
        setNeedsReconnect();
      }
    }
  }catch(e){ /* ignore */ }
})();

async function ensureFileHandle(){
  if(fileHandle) return fileHandle;
  if(pendingHandle){
    try{
      const perm = await pendingHandle.requestPermission({mode:'readwrite'});
      if(perm === 'granted'){
        fileHandle = pendingHandle;
        await loadFromHandle();
        setConnected();
        return fileHandle;
      }
    }catch(e){ /* fall through to fresh picker */ }
  }
  if(!fsAccessSupported) return null;
  try{
    fileHandle = await window.showSaveFilePicker({
      suggestedName: 'bar-data.json',
      types: [{ description:'JSON', accept:{'application/json':['.json']} }]
    });
    await idbSet('fileHandle', fileHandle);
    await writeToHandle();
    setConnected();
    return fileHandle;
  }catch(e){ return null; }
}

function downloadSnapshot(){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'bar-data.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function saveData(statusEl){
  const handle = await ensureFileHandle();
  const now = new Date().toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'});
  if(handle){
    await writeToHandle();
    statusEl.textContent = `Enregistré — ${now}`;
  } else {
    downloadSnapshot();
    statusEl.textContent = `Fichier téléchargé (bar-data.json) — ${now}`;
  }
}

// ---------- Login ----------
const loginScreen = document.getElementById('loginScreen');
const appShell = document.getElementById('appShell');
const roleSelect = document.getElementById('roleSelect');
const barmaidNameLabel = document.getElementById('barmaidNameLabel');
const barmaidNameSelect = document.getElementById('barmaidNameSelect');
const pinInput = document.getElementById('pinInput');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');
const logoutBtn = document.getElementById('logoutBtn');

bartenders.forEach(name=>{
  const opt = document.createElement('option'); opt.value = name; opt.textContent = name;
  barmaidNameSelect.appendChild(opt);
});
function refreshBarmaidNameVisibility(){
  const show = roleSelect.value === 'barmaid';
  barmaidNameLabel.style.display = show ? 'block' : 'none';
  barmaidNameSelect.style.display = show ? 'block' : 'none';
}
roleSelect.addEventListener('change', refreshBarmaidNameVisibility);
refreshBarmaidNameVisibility();

function attemptLogin(){
  const role = roleSelect.value;
  const pin = pinInput.value;
  if(pin === rolePins[role]){
    state.role = role;
    state.loggedInName = (role === 'barmaid') ? barmaidNameSelect.value : null;
    state.tab = roleTabs[role][0];
    state.subView = null; state.pdfView = null;
    loginError.textContent = '';
    pinInput.value = '';
    loginScreen.style.display = 'none';
    appShell.style.display = 'block';
    renderDayButtons(); renderTabs(); renderPanel();
  } else {
    loginError.textContent = 'NIP incorrect pour ce rôle.';
  }
}
loginBtn.addEventListener('click', attemptLogin);
pinInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') attemptLogin(); });
logoutBtn.addEventListener('click', ()=>{
  state.role = null;
  appShell.style.display = 'none';
  loginScreen.style.display = 'flex';
  pinInput.value = ''; loginError.textContent = '';
});

const prefsModal = document.getElementById('prefsModal');
const closePrefsBtn = document.getElementById('closePrefsBtn');
const prefsRoleName = document.getElementById('prefsRoleName');
const newPinInput = document.getElementById('newPinInput');
const savePinBtn = document.getElementById('savePinBtn');
const pinSaveMsg = document.getElementById('pinSaveMsg');
const themeGrid = document.getElementById('themeGrid');

function renderThemeGrid(){
  themeGrid.innerHTML = '';
  const current = data.settings?.theme || 'jour';
  themes.forEach(t=>{
    const btn = document.createElement('div');
    btn.className = 'theme-swatch' + (t.id===current ? ' active' : '');
    btn.textContent = t.label;
    btn.addEventListener('click', ()=>{ applyTheme(t.id); renderThemeGrid(); });
    themeGrid.appendChild(btn);
  });
}

prefsBtn.addEventListener('click', ()=>{
  prefsRoleName.textContent = roleLabels[state.role] || '';
  newPinInput.value = ''; pinSaveMsg.textContent = '';
  renderThemeGrid();
  prefsModal.style.display = 'flex';
});
closePrefsBtn.addEventListener('click', ()=>{ prefsModal.style.display = 'none'; });
savePinBtn.addEventListener('click', ()=>{
  const val = newPinInput.value.trim();
  if(!/^\d{4,6}$/.test(val)){
    pinSaveMsg.style.color = '#B0402A';
    pinSaveMsg.textContent = 'Le NIP doit avoir 4 à 6 chiffres.';
    return;
  }
  rolePins[state.role] = val;
  if(!data.settings) data.settings = {};
  if(!data.settings.pins) data.settings.pins = {};
  data.settings.pins[state.role] = val;
  pinSaveMsg.style.color = 'var(--ok)';
  pinSaveMsg.textContent = 'NIP mis à jour — pense à cliquer Enregistrer sur un formulaire pour le sauvegarder dans le fichier.';
  newPinInput.value = '';
});

renderPanel();
